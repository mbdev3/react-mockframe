name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  # npm trusted publishing (OIDC): no long-lived token, provenance included
  id-token: write

jobs:
  publish:
    if: github.repository == 'mbdev3/react-mockframe' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter react-mockframe test
      - run: pnpm build:lib
      - run: npm publish --access public
        working-directory: src/package
        env:
          # Fallback when no trusted publisher is configured on npmjs.com
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
